name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The MovieLens demos need a real ~5MB download and several
      # minutes of CPU-only training; they're excluded from CI on
      # purpose (see README) and run manually, same reasoning as every
      # other "real-data benchmark" script in this portfolio.
      - name: Run correctness tests (synthetic data only)
        run: PYTHONPATH=. pytest tests/ -v
