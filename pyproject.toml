[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-ranking"
version = "0.1.0"
description = "Conformal prediction for ranking/recommendation: APS (Romano et al., 2020), extended from classification to ranking, structured to match TorchCP's module conventions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["conformal_ranking*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
